<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Smart Tractor | Kheti ka kaam aur hisaab</title>
    <meta
      name="description"
      content="Smart Tractor: tractor ka kaam, kisan, driver, payment aur kharcha ka poora hisaab ek jagah."
    />

    <!-- Browser bar / mobile ka color (app ki green theme se match) -->
    <meta name="theme-color" content="#16a34a" />
    <meta name="color-scheme" content="light" />

    <!-- Favicon: emoji se, alag file ki zaroorat nahi. Apna logo ho to ise badal dena -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9A%9C%3C/text%3E%3C/svg%3E"
    />

    <!-- Phone me "Add to Home Screen" karne par app jaisa dikhe -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Smart Tractor" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Link share karne par preview (WhatsApp etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Smart Tractor" />
    <meta
      property="og:description"
      content="Tractor ka kaam, kisan, driver, payment aur kharcha ka poora hisaab ek jagah."
    />

    <!-- SPA redirect (GitHub Pages 404.html trick). Head me rakha hai taaki React se pehle chale -->
    <script>
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>

    <!-- App load hone tak dikhne wala spinner (React aate hi hat jaata hai) -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: #f8fafc;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #475569;
        font-size: 14px;
      }
      #app-loader .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #bbf7d0;
        border-top-color: #16a34a;
        border-radius: 50%;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="app-loader" role="status" aria-live="polite">
        <div class="spinner"></div>
        <span>Smart Tractor khul raha hai...</span>
      </div>
    </div>

    <noscript>Smart Tractor chalane ke liye browser me JavaScript on karo.</noscript>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
